<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Plan Shark 登录</title>
    <style>
        :root {
            --bg: #101214;
            --panel: #181c20;
            --line: rgba(255,255,255,0.10);
            --ink: #f3f6f8;
            --muted: #98a3ad;
            --accent: #1de5c0;
            --warn: #ffad42;
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            min-height: 100vh;
            display: grid;
            place-items: center;
            font-family: "Avenir Next", "PingFang SC", "Microsoft YaHei", sans-serif;
            color: var(--ink);
            background: #0d0f12;
        }

        .shell {
            width: min(980px, calc(100% - 32px));
            display: grid;
            grid-template-columns: 0.9fr 1.1fr;
            gap: 22px;
            align-items: stretch;
        }

        .brand,
        .panel {
            border: 1px solid var(--line);
            border-radius: 16px;
            background: var(--panel);
            padding: 28px;
        }

        .brand {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            min-height: 520px;
            background:
                linear-gradient(135deg, rgba(29,229,192,0.18), transparent 38%),
                linear-gradient(180deg, #171b20, #111316);
        }

        h1, h2 {
            margin: 0;
            letter-spacing: 0;
        }

        h1 {
            font-size: 44px;
        }

        p {
            color: var(--muted);
            line-height: 1.7;
        }

        .tabs,
        .modes {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
            margin-bottom: 18px;
        }

        button {
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(255,255,255,0.04);
            color: var(--ink);
            padding: 12px 14px;
            font: inherit;
            font-weight: 800;
            cursor: pointer;
        }

        button.active,
        button.primary {
            border-color: rgba(29,229,192,0.55);
            background: rgba(29,229,192,0.13);
            color: #dffff8;
        }

        button.primary {
            width: 100%;
            margin-top: 14px;
        }

        label {
            display: block;
            color: var(--muted);
            font-size: 13px;
            font-weight: 800;
            margin: 12px 0 7px;
        }

        input {
            width: 100%;
            border: 1px solid var(--line);
            border-radius: 10px;
            background: rgba(255,255,255,0.05);
            color: var(--ink);
            padding: 13px 14px;
            font: inherit;
            outline: none;
        }

        .status {
            min-height: 24px;
            margin-top: 12px;
            color: var(--muted);
        }

        .status.error {
            color: #ff837d;
        }

        .mode-panel {
            display: none;
            margin-top: 22px;
            padding-top: 20px;
            border-top: 1px solid var(--line);
        }

        .mode-panel.show {
            display: block;
        }

        .auth-form.hidden {
            display: none;
        }

        @media (max-width: 820px) {
            .shell {
                grid-template-columns: 1fr;
            }

            .brand {
                min-height: auto;
            }
        }
    </style>
</head>
<body>
<div class="shell">
    <section class="brand">
        <div>
            <h1>Plan Shark</h1>
            <p>登录后选择训练模式，再进入手牌训练。训练历史会按玩家、模式和session保存到MySQL。</p>
        </div>
        <p>默认模式是 Cash，后续可以继续扩展 MTT 的盲注、筹码深度、ICM 等训练维度。</p>
    </section>

    <section class="panel">
        <div class="auth-form" id="authForm">
            <div class="tabs">
                <button id="loginTab" class="active">登录</button>
                <button id="registerTab">注册</button>
            </div>
            <h2 id="formTitle">玩家登录</h2>
            <label for="username">用户名</label>
            <input id="username" autocomplete="username" placeholder="例如 shark001">
            <label for="password">密码</label>
            <input id="password" type="password" autocomplete="current-password" placeholder="至少6位">
            <label for="displayName" id="displayNameLabel" style="display:none;">昵称</label>
            <input id="displayName" style="display:none;" placeholder="可选">
            <button class="primary" id="submitButton">登录</button>
            <div class="status" id="status">未登录。</div>
        </div>

        <div class="mode-panel" id="modePanel">
            <h2>选择训练模式</h2>
            <p>当前玩家：<span id="playerName"></span></p>
            <div class="modes">
                <button class="active" data-mode="CASH">Cash</button>
                <button data-mode="MTT">MTT</button>
            </div>
            <button class="primary" id="enterTrainer">进入训练</button>
        </div>
    </section>
</div>

<script>
    let mode = "login";
    let selectedMode = "CASH";
    const loginTab = document.getElementById("loginTab");
    const registerTab = document.getElementById("registerTab");
    const formTitle = document.getElementById("formTitle");
    const authForm = document.getElementById("authForm");
    const submitButton = document.getElementById("submitButton");
    const statusEl = document.getElementById("status");
    const modePanel = document.getElementById("modePanel");
    const playerName = document.getElementById("playerName");
    const displayName = document.getElementById("displayName");
    const displayNameLabel = document.getElementById("displayNameLabel");

    loginTab.addEventListener("click", () => setMode("login"));
    registerTab.addEventListener("click", () => setMode("register"));
    submitButton.addEventListener("click", submitAuth);
    document.getElementById("enterTrainer").addEventListener("click", enterTrainer);
    document.querySelectorAll("button[data-mode]").forEach(button => {
        button.addEventListener("click", () => {
            selectedMode = button.dataset.mode;
            document.querySelectorAll("button[data-mode]").forEach(node => node.classList.remove("active"));
            button.classList.add("active");
        });
    });

    checkMe();

    function setMode(nextMode) {
        mode = nextMode;
        loginTab.classList.toggle("active", mode === "login");
        registerTab.classList.toggle("active", mode === "register");
        formTitle.textContent = mode === "login" ? "玩家登录" : "注册玩家";
        submitButton.textContent = mode === "login" ? "登录" : "注册";
        displayName.style.display = mode === "register" ? "block" : "none";
        displayNameLabel.style.display = mode === "register" ? "block" : "none";
        setStatus(mode === "login" ? "未登录。" : "注册后会自动登录。");
    }

    async function submitAuth() {
        try {
            const payload = {
                username: document.getElementById("username").value,
                password: document.getElementById("password").value,
                displayName: displayName.value
            };
            const response = await fetch(`/api/auth/${mode}`, {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify(payload)
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || "操作失败");
            }
            showPlayer(data);
        } catch (error) {
            setStatus(error.message, true);
        }
    }

    async function enterTrainer() {
        try {
            const response = await fetch("/api/auth/mode", {
                method: "POST",
                headers: {"Content-Type": "application/json"},
                body: JSON.stringify({mode: selectedMode})
            });
            const data = await response.json();
            if (!response.ok) {
                throw new Error(data.error || "模式选择失败");
            }
            window.location.href = "/trainer";
        } catch (error) {
            setStatus(error.message, true);
        }
    }

    async function checkMe() {
        try {
            const response = await fetch("/api/auth/me");
            if (!response.ok) {
                return;
            }
            showPlayer(await response.json());
        } catch (ignored) {
        }
    }

    function showPlayer(player) {
        authForm.classList.add("hidden");
        playerName.textContent = `${player.displayName} (${player.username})`;
        selectedMode = player.mode || "CASH";
        document.querySelectorAll("button[data-mode]").forEach(button => {
            button.classList.toggle("active", button.dataset.mode === selectedMode);
        });
        modePanel.classList.add("show");
        setStatus("已登录，请选择训练模式。");
    }

    function setStatus(message, error = false) {
        statusEl.textContent = message;
        statusEl.className = error ? "status error" : "status";
    }
</script>
</body>
</html>
